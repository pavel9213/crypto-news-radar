name: Collect crypto news

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-crypto-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source configuration
        run: python scripts/validate_data.py
      - name: Collect feeds
        run: python scripts/collect_news.py
      - name: Validate generated data
        run: python scripts/validate_data.py
      - name: Generate live status badge data
        run: |
          python - <<'PY'
          import json
          from datetime import datetime

          with open("data/news.json", encoding="utf-8") as f:
              data = json.load(f)

          generated_at = data.get("generated_at")
          try:
              dt = datetime.fromisoformat(generated_at.replace("Z", "+00:00"))
              refreshed = dt.strftime("%Y-%m-%d %H:%M UTC")
          except (AttributeError, ValueError):
              refreshed = "not available"

          status = {
              "schemaVersion": 1,
              "label": "live data",
              "message": f'{data.get("event_count", 0)} stories · {data.get("source_count", 0)} sources',
              "color": "blue"
          }
          updated = {
              "schemaVersion": 1,
              "label": "data refreshed",
              "message": refreshed,
              "color": "green"
          }

          for path, payload in [
              ("data/status.json", status),
              ("data/updated.json", updated),
          ]:
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False, indent=2)
                  f.write("\\n")
          PY
      - name: Stage and commit news data and status
        run: |
          git add data/news.json data/status.json data/updated.json
          if git diff --cached --quiet; then
            echo "No news data or status changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh collected crypto news and status"
          git push
