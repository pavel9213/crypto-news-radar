name: Collect crypto news

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-crypto-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source configuration
        run: python scripts/validate_data.py
      - name: Collect feeds
        run: python scripts/collect_news.py
      - name: Validate generated data
        run: python scripts/validate_data.py
      - name: Stage and commit news data
        run: |
          git add data/news.json
          if git diff --cached --quiet -- data/news.json; then
            echo "No news data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh collected crypto news"
          git push
